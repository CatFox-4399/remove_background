<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35" />

  <!-- Decorative background elements: Cutout transparency grid preview -->
  <g opacity="0.08">
    <rect x="256" y="64" width="64" height="64" fill="#ffffff" />
    <rect x="384" y="64" width="64" height="64" fill="#ffffff" />
    <rect x="320" y="128" width="64" height="64" fill="#ffffff" />
    <rect x="256" y="192" width="64" height="64" fill="#ffffff" />
    <rect x="384" y="192" width="64" height="64" fill="#ffffff" />
    <rect x="320" y="256" width="64" height="64" fill="#ffffff" />
    <rect x="256" y="320" width="64" height="64" fill="#ffffff" />
    <rect x="384" y="320" width="64" height="64" fill="#ffffff" />
    <rect x="320" y="384" width="64" height="64" fill="#ffffff" />
  </g>

  <!-- Scissors Cutout Icon with Glow -->
  <g transform="translate(256, 256) scale(15) translate(-12, -12)" filter="url(#glow)">
    <!-- Bottom Handle Loop -->
    <circle cx="6" cy="18" r="3" fill="none" stroke="url(#bladeGrad)" stroke-width="2.4" />
    <!-- Top Handle Loop -->
    <circle cx="6" cy="6" r="3" fill="none" stroke="url(#bladeGrad)" stroke-width="2.4" />
    <!-- Long Blade -->
    <line x1="20" y1="4" x2="8.12" y2="15.88" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
    <!-- Pivot & Short Blade -->
    <line x1="14.47" y1="14.48" x2="20" y2="20" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
    <line x1="8.12" y1="8.12" x2="12" y2="12" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
    <!-- Pivot Pin -->
    <circle cx="12" cy="12" r="1.3" fill="#38bdf8" />
  </g>

  <!-- Magic Sparkles -->
  <g fill="#38bdf8">
    <path d="M 380 120 Q 380 140 400 140 Q 380 140 380 160 Q 380 140 360 140 Q 380 140 380 120 Z" />
    <path d="M 130 360 Q 130 375 145 375 Q 130 375 130 390 Q 130 375 115 375 Q 130 375 130 360 Z" opacity="0.75" />
    <circle cx="395" cy="220" r="5" opacity="0.8" />
  </g>
</svg>
